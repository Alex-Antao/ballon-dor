<title>Laboratório Bola de Ouro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho + faixa de anos; quatro colunas de ranking lado a lado (Real, Previsão, Justo, Meu); detalhe do jogador por baixo. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#14202b; --muted:#5d6b78; --line:#d9e0e6;
  --real:#14202b; --hist:#2b5fd9; --fair:#0f8a7e; --mine:#b4690e;
  --ok:#1b8a4b; --bad:#c23b3b; --chip:#e6ebf0;
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#16202a; --fg:#e7edf2; --muted:#94a3b0; --line:#273543;
  --real:#e7edf2; --hist:#7ea4ff; --fair:#3fcfbf; --mine:#f0a24a;
  --ok:#4cc884; --bad:#ef7676; --chip:#1f2c38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#16202a; --fg:#e7edf2; --muted:#94a3b0; --line:#273543;
  --real:#e7edf2; --hist:#7ea4ff; --fair:#3fcfbf; --mine:#f0a24a;
  --ok:#4cc884; --bad:#ef7676; --chip:#1f2c38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 clamp(1.7rem,4vw,2.5rem)/1.05 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:700 1.15rem/1.2 var(--f-display);margin:0}
h3{font:600 .95rem/1.3 var(--f-body);margin:0}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.top p{color:var(--muted);max-width:60ch;margin-top:6px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hist);outline-offset:2px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.years{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.yr{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font:500 .85rem var(--f-mono);display:flex;flex-direction:column;align-items:center;gap:2px}
.yr small{font:500 .62rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.yr[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.yr[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--c)}
.col header{display:flex;flex-direction:column;gap:2px}
.col header h2{color:var(--c)}
.col header span{font-size:.78rem;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.row{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.row:hover{background:var(--chip)}
.row[aria-pressed="true"]{border-color:var(--c);background:var(--chip)}
.pos{font:500 .8rem var(--f-mono);color:var(--muted)}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{grid-column:2/4;font-size:.76rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.sc{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.tag{font:500 .68rem var(--f-mono);padding:1px 6px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.win{background:var(--ok);color:#fff}
.tag.hit{background:var(--ok);color:#fff}
.faded{opacity:.55}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.good{color:var(--ok);font-weight:600}
.miss{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);border-top:4px solid var(--c);display:flex;flex-direction:column;gap:4px}
.stat b{font:700 2rem/1 var(--f-display);color:var(--c)}
.stat span{font-size:.8rem;color:var(--muted)}
.brk{display:flex;flex-direction:column;gap:5px}
.brk div{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;font-size:.8rem;align-items:center}
.brk em{font-style:normal;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .bb{grid-column:1/3;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.brk .bb i{display:block;height:100%;background:var(--c)}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 22px}
.sl label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted)}
.sl label b{color:var(--fg);font-weight:600;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--mine)}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 12px;font-size:.82rem}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:78ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.conf{font:600 .7rem var(--f-mono);padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
.conf-A{color:var(--ok)} .conf-B{color:var(--mine)} .conf-C{color:var(--bad)}
.bar-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tabs.seg .tab{font-size:.82rem;padding:5px 11px}
.src{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;word-break:break-all}
.src a{color:var(--hist)}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Laboratório Bola de Ouro</h1>
      <p>Três algoritmos para decidir o vencedor, comparados com o resultado real de cada ano entre 1956 e 2026.</p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div id="view"></div>
</div>

<script>
/*DATA*/
</script>
<script>
/*MODELS*/
</script>
<script>
(function(){
const {YEARS,leagueStrength,cupWeight}=window.BDO_DATA, M=window.BDO_MODELS;
const HW=/*WEIGHTS*/[];
const FITS=/*STATS*/{};
const SOURCES=/*SOURCES*/{};
const HWL=L=>(FITS[L]||FITS.elig).weights;
const SEL=/*SELECTION*/{};
// pesos da Previsão para o ano y: na lista de elegíveis, treinados só com anos anteriores (previsão honesta); senão o ajuste único
const TW=y=>st.list==='elig'&&SEL.temporal&&SEL.temporal[y]?SEL.temporal[y]:null;
const HWY=y=>{const t=TW(y);return t?t.weights:HWL(st.list)};
const histDesc=y=>{const t=TW(y);return t?`Pesos treinados só com ${t.train[0]}–${t.train[1]}`:(st.list==='elig'?'Sem anos anteriores suficientes: ajuste a todos os anos (dentro da amostra)':'Ajuste único aos vencedores (dentro da amostra)')};
const LISTS=[['elig','Só elegíveis'],['all','Todos (incl. inelegíveis)']];
const CUPN={UCL:'Taça dos Campeões/UCL',CWC:'Taça das Taças',UEL:'Taça UEFA/Liga Europa',ECL:'Liga Conferência',LIB:'Libertadores',SUD:'Sul-Americana'};
const WIN={CY:'ano civil',S:'época que termina no ano (recurso)',P:'época'};
const ALGS=[{k:'real',n:'Resultado real',c:'var(--real)',d:'Votação oficial'},
 {k:'hist',n:'Previsão',c:'var(--hist)',d:'Pesos treinados só com anos anteriores'},
 {k:'fair',n:'Justo',c:'var(--fair)',d:'Só desempenho individual'},
 {k:'mine',n:'O meu',c:'var(--mine)',d:'Individual + crédito de equipa proporcional'}];
const VIDEO26=['Harry Kane','Michael Olise','Ousmane Dembélé','Kylian Mbappé','Lamine Yamal','Rodri','Erling Haaland','Khvicha Kvaratskhelia','Luis Díaz','Vitinha'];
const VID={k:'video',n:'Lista do vídeo',c:'var(--muted)',d:'Ranking que o vídeo mostra para 2026'};
const STAGE=['grupos/fora','oitavos','quartos','meias','final perdida','vencedor'];
const POS={FW:'Avançado',W:'Extremo',AM:'Médio ofensivo',CM:'Médio',DM:'Médio defensivo',DF:'Defesa',GK:'Guarda-redes'};
const years=Object.keys(YEARS).map(Number);
const MINE0=Object.assign({},M.MINE_DEFAULT);
let st={tab:'ano',year:2026,list:'elig',sel:null,mine:Object.assign({},MINE0)};
const realOf=y=>M.target(YEARS[y],st.list);
const rowsOf=y=>M.listRows(YEARS[y],st.list);
try{const h=location.hash.slice(1);if(h==='resumo'||h==='metodo')st.tab=h;else if(/^a\d{4}$/.test(h)&&YEARS[h.slice(1)]){st.year=+h.slice(1)}}catch(e){}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

function compute(y){
  const rows=rowsOf(y), ctx=M.predCtx(rows), w=HWY(y);
  return {
    hist:M.rankYear(rows,r=>M.predict(r,w,ctx)),
    fair:M.rankYear(rows,r=>M.fair(r)),
    mine:M.rankYear(rows,r=>M.mine(r,st.mine))
  };
}
const cache={};
function all(y){return compute(y)}

function tabs(){
  const T=[['ano','Por ano'],['resumo','Resumo'],['metodo','Método']];
  $('#tabs').innerHTML=T.map(([k,l])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${st.tab===k}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;try{location.hash=st.tab==='ano'?'a'+st.year:st.tab}catch(e){}render()});
}

function listToggle(redo){
  return `<div class="tabs seg" role="group" aria-label="Lista de candidatos">${LISTS.map(([k,l])=>`<button class="tab lst" data-l="${k}" aria-selected="${st.list===k}">${l}</button>`).join('')}</div>`;
}
function bindList(redo){$('#view').querySelectorAll('.lst').forEach(b=>b.onclick=()=>{st.list=b.dataset.l;st.sel=null;redo()})}

function yearStrip(){
  return `<div class="years">${years.map(y=>`<button class="yr" data-y="${y}" aria-pressed="${y===st.year}">${y}<small>${YEARS[y].winner?'':'sem prémio'}</small></button>`).join('')}</div>`;
}

function colHtml(a,res,y){
  const Y=YEARS[y], rows=rowsOf(y), real=realOf(y);
  let items;
  if(a.k==='video'){
    items=VIDEO26.map((n,i)=>({r:Y.rows.find(r=>r.name===n),pos:i+1,score:null})).filter(x=>x.r);
  } else if(a.k==='real'){
    const rk=rows.filter(r=>r.rank).sort((p,q)=>p.rank-q.rank).map(r=>({r,pos:r.rank,score:null}));
    const rest=rows.filter(r=>!r.rank).sort((p,q)=>(q.name===real)-(p.name===real)).map(r=>({r,pos:'–',score:null,faded:r.name!==real,retro:r.name===real}));
    items=rk.concat(rest);
  } else {
    const mx=Math.max(...res[a.k].map(x=>x.score));
    items=res[a.k].map((x,i)=>({r:x.r,pos:i+1,score:x.score,w:Math.max(0,x.score)/mx*100}));
  }
  const li=items.map(it=>{
    const r=it.r, isW=real&&r.name===real;
    const inel=r.elig===0?'<span class="tag">inelegível</span>':'';
    const tag=(a.k==='video'?(r.rank?`<span class="tag">real #${r.rank}</span>`:''):a.k==='real'?(it.retro?'<span class="tag win">vencedor retroativo</span>':it.pos===1&&r.name===Y.winner?'<span class="tag win">vencedor</span>':(it.faded?'':'<span class="tag">#'+it.pos+'</span>')):(r.rank?`<span class="tag ${isW&&it.pos===1?'hit':''}">real #${r.rank}</span>`:isW&&it.pos===1?'<span class="tag hit">retroativo</span>':''))+inel;
    return `<li><button class="row ${it.faded?'faded':''}" style="--c:${a.c}" data-n="${esc(r.name)}" aria-pressed="${st.sel===r.name}">
      <span class="pos">${it.pos}</span><span class="nm">${esc(r.name)}</span>
      <span class="sc">${it.score==null?'':(a.k==='hist'?it.score.toFixed(2):it.score.toFixed(0))}</span>
      <span class="sub"><span>${esc(r.club)} · ${POS[r.pos]}</span>${tag}</span>
      ${it.score==null?'':`<span class="bar"><i style="width:${it.w}%"></i></span>`}
    </button></li>`;
  }).join('');
  return `<section class="col" style="--c:${a.c}"><header><h2>${a.n}</h2><span>${a.k==='hist'?histDesc(y):a.d}</span></header><ul class="list">${li}</ul></section>`;
}

function detail(y,res){
  if(!st.sel)return `<div class="note">Escolhe um jogador numa das colunas para ver os números e a decomposição da pontuação em cada algoritmo.</div>`;
  const r=rowsOf(y).find(x=>x.name===st.sel); if(!r)return '';
  const ctx=M.predCtx(rowsOf(y));
  const pos=k=>res[k].findIndex(x=>x.r===r)+1;
  const parts={hist:M.predict(r,HWY(y),ctx).parts,fair:M.fair(r).parts,mine:M.mine(r,st.mine).parts};
  const brk=k=>{const a=ALGS.find(z=>z.k===k);const e=Object.entries(parts[k]).filter(([,v])=>v>0.0001).sort((p,q)=>q[1]-p[1]);
    const mx=Math.max(...e.map(x=>x[1]),1e-9);
    return `<div style="--c:${a.c}"><h3 style="color:${a.c}">${a.n} · ${pos(k)}.º lugar</h3><div class="brk">${e.map(([n,v])=>`<div><em title="${esc(n)}">${esc(n)}</em><span class="sc">${v.toFixed(k==='hist'?2:0)}</span><span class="bb"><i style="width:${v/mx*100}%"></i></span></div>`).join('')}</div></div>`};
  const nt=r.ntT?`${r.ntT}: ${r.ntGP} j, ${r.ntG} g, ${r.ntA} a, ${STAGE[r.ntS]}`:'sem torneio de seleções';
  const cw=cupWeight(r.uT,y), eu=r.uT?`${CUPN[r.uT]} (peso ${cw.toFixed(2)})`:'sem prova continental';
  const sr=(SOURCES[y]||{})[r.name];
  const srcH=sr&&(sr.sources.length||sr.note)?`<div class="src"><b>Fontes:</b>${sr.sources.map(u=>{let h=u;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){}return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}</a>`}).join('')}${sr.note?`<span>${esc(sr.note)}</span>`:''}</div>`:'';
  return `<div class="panel"><div><h2>${esc(r.name)} <span class="conf conf-${r.conf}" title="A verificado em fontes, B parcialmente verificado/aproximado, C estimativa">dados ${r.conf}</span> <span class="conf conf-${r.aConf}" title="Confiança só das assistências">assist. ${r.aConf}</span></h2>
    <p class="note" style="margin-top:6px">${esc(r.club)} · ${POS[r.pos]} · liga ${r.lg} (força ${leagueStrength(r.lg,y).toFixed(2)} nesta década) · ${r.title?'campeão nacional':'não campeão nacional'}${r.rank?' · classificado em '+r.rank+'.º na votação':''}${r.elig===0?' · inelegível segundo as regras de '+y:''} · janela: ${WIN[r.win]}</p></div>
    <div class="scroll"><table><tr><th>Liga + Europa</th><th>Europa</th><th>Seleção</th>${r.cont!=null?'<th>Contributo não ofensivo*</th>':''}</tr>
    <tr><td class="n">${r.gp} j · ${r.g} g · ${r.a} a</td><td class="n">${r.uG} g · ${r.uA} a · ${STAGE[r.uS]}<br><small>${esc(eu)}</small></td><td class="n">${esc(nt)}</td>${r.cont!=null?`<td class="n">${r.cont}/10</td>`:''}</tr></table></div>${srcH}
    ${r.cont!=null?'<p class="note">*Estimativa subjetiva minha para médios, defesas e guarda-redes, porque golos e assistências não medem o seu impacto.</p>':''}
    <div class="cols2">${brk('hist')}${brk('fair')}${brk('mine')}</div></div>`;
}

function minePanel(){
  const m=st.mine;
  const S=(k,l,min,max,step,f)=>`<label>${l}<b><span></span><span id="v_${k}">${(f||(x=>x))(m[k])}</span></b><input type="range" id="s_${k}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${m[k]}"></label>`;
  return `<div class="panel" style="border-top:4px solid var(--mine)"><div><h2 style="color:var(--mine)">Ajusta o meu algoritmo</h2><p class="note" style="margin-top:6px">Mexe nos pesos e vê a coluna “O meu” mudar em todos os anos, incluindo no Resumo.</p></div>
  <div class="sl">${S('wTeam','Peso do crédito de equipa',0,0.6,0.01,x=>Math.round(x*100)+'%')}${S('euBonus','Bónus Europa (oposição de topo)',0,0.8,0.05,x=>'+'+Math.round(x*100)+'%')}${S('ntBoost','Peso da seleção (torneio)',0.6,1.6,0.05,x=>'×'+(+x).toFixed(2))}${S('assistW','Valor de uma assistência vs golo',0.3,1,0.05,x=>(+x).toFixed(2))}${S('wCont','Peso do contributo não ofensivo',0,0.6,0.02,x=>Math.round(x*100)+'%')}</div>
  <div><button class="btn" id="reset">Repor valores por defeito</button></div></div>`;
}

function viewYear(){
  const y=st.year, Y=YEARS[y], res=all(y), real=realOf(y);
  const winTxt=!Y.winner?'Prémio não atribuído (COVID-19)':(real!==Y.winner?`Vencedor retroativo (France Football, 2016): <b>${esc(real)}</b> · oficial: ${esc(Y.winner)}`:`Vencedor real: <b>${esc(Y.winner)}</b>`);
  const picks=['hist','fair','mine'].map(k=>{const n=res[k][0].r.name;const ok=real&&n===real;
    return `<span>${ALGS.find(a=>a.k===k).n}: <b class="${ok?'good':''}">${esc(n)}${ok?' ✓':''}</b></span>`}).join('');
  const nIn=Y.rows.filter(r=>r.elig===0).length;
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${yearStrip()}
   <div class="bar-top"><div class="meta"><span>${esc(Y.label)}</span><span>${esc(Y.award)}</span><span>${winTxt}</span>${picks}</div>${listToggle()}</div>
   ${Y.notes||nIn?`<div class="note">${esc(Y.notes||'')}${nIn?` ${nIn} candidato(s) inelegíve(is) neste ano: só aparecem na lista “Todos”.`:''}${Y.winnerAllNote?' '+esc(Y.winnerAllNote):''}</div>`:''}
   ${y===2026?'<div class="note">Em 2026 a Previsão usa só 2000–2025 e não viu estes dados. A última coluna é a ordem que o vídeo mostra para o seu modelo histórico. A minha Previsão não a reproduz: ordenei os candidatos sem as taças nacionais e sem a contagem fina de troféus que o vídeo parece usar, por isso Olise e Dembélé ficam mais abaixo.</div>':''}
   <div class="grid">${ALGS.concat(y===2026?[VID]:[]).map(a=>colHtml(a,res,y)).join('')}</div>
   ${detail(y,res)}${minePanel()}</div>`;
  $('#view').querySelectorAll('.yr').forEach(b=>b.onclick=()=>{st.year=+b.dataset.y;st.sel=null;try{location.hash='a'+st.year}catch(e){}viewYear()});
  $('#view').querySelectorAll('.row').forEach(b=>b.onclick=()=>{st.sel=st.sel===b.dataset.n?null:b.dataset.n;viewYear()});
  bindMine(viewYear);bindList(viewYear);
  const s=$('#view .yr[aria-pressed="true"]');if(s&&s.scrollIntoView)try{s.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}

function bindMine(redo){
  $('#view').querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>{st.mine[i.dataset.k]=+i.value;redo()});
  const r=$('#reset');if(r)r.onclick=()=>{st.mine=Object.assign({},MINE0);redo()};
}

function summary(){
  const algK=['hist','fair','mine'];
  const z=()=>({w:0,t3:0,n:0,w10:0,n10:0});
  const stats={hist:z(),fair:z(),mine:z()};
  const out=[];
  years.forEach(y=>{const res=all(y), real=realOf(y); const row={y,real,p:{}};
    algK.forEach(k=>{const top=res[k].map(x=>x.r.name);row.p[k]=top[0];const s=stats[k];
      if(real&&y<=2025){s.n++;if(top[0]===real)s.w++;if(top.slice(0,3).includes(real))s.t3++;
        if(y>=2010){s.n10++;if(top[0]===real)s.w10++;}}});
    out.push(row)});
  const l26=(k)=>out.find(o=>o.y===2026).p[k]===YEARS[2026].winner;
  const y0=years[0];
  const cards=algK.map(k=>{const a=ALGS.find(z=>z.k===k),s=stats[k];
    return `<div class="stat" style="--c:${a.c}"><b>${s.w}/${s.n}</b><h3>${a.n}</h3><span>vencedores certos em ${y0}–2025 · ${s.t3}/${s.n} no top 3 · 2010–2025: ${s.w10}/${s.n10} · 2026: ${l26(k)?'acerta':'falha'}</span></div>`}).join('');
  const F=FITS[st.list]||FITS.elig, Fr=FITS.recent;
  const rowsH=out.map(o=>{
    const cell=k=>{const ok=o.real&&o.p[k]===o.real;return `<td class="${ok?'good':(o.real?'miss':'miss')}">${esc(o.p[k])}${ok?' ✓':''}</td>`};
    return `<tr><td class="n"><a href="#a${o.y}" data-y="${o.y}" style="color:inherit">${o.y}</a></td><td><b>${o.real?esc(o.real):'não atribuído'}</b></td>${cell('hist')}${cell('fair')}${cell('mine')}</tr>`}).join('');
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
   <div class="bar-top"><span class="meta">Lista: ${st.list==='all'?'todos os candidatos; o alvo é o vencedor retroativo da France Football quando o melhor era inelegível':'só quem podia ganhar segundo as regras de cada ano'}</span>${listToggle()}</div>
   <div class="cards">${cards}</div>
   <div class="note">${st.list==='elig'&&SEL.temporal?`Nos elegíveis, a Previsão de cada ano é a previsão que se teria feito na altura: pesos treinados só com os anos anteriores, sem ver esse ano nem os seguintes. Em 2010–2026 acerta ${SEL.nestedWindow.hits} de ${SEL.targets.length}; em 1961–2009, ${SEL.temporalOld[0]} de ${SEL.temporalOld[1]}. Nos anos ${years[0]}–${years[0]+4} não há anos anteriores suficientes e usa-se o ajuste a todos os anos (dentro da amostra).`:`Na lista “Todos” a Previsão usa um ajuste único aos vencedores retroativos de ${F.train[0]}–${F.train[1]}, por isso o resultado é “dentro da amostra” (${F.inSample}/${F.n}); deixando um ano de fora, ${F.loo} de ${F.n}.`} O Justo e o Meu não foram ajustados aos vencedores. O Meu muda com os controlos na vista “Por ano”.</div>
   <div class="panel"><div class="scroll"><table><tr><th>Ano</th><th>Vencedor real</th><th style="color:var(--hist)">Previsão</th><th style="color:var(--fair)">Justo</th><th style="color:var(--mine)">O meu</th></tr>${rowsH}</table></div></div></div>`;
  bindList(summary);
  $('#view').querySelectorAll('a[data-y]').forEach(a=>a.onclick=e=>{e.preventDefault();st.year=+a.dataset.y;st.tab='ano';st.sel=null;try{location.hash='a'+st.year}catch(x){}render()});
}

function method(){
  const F=FITS.elig, FA=FITS.all, Fr=FITS.recent;
  const miss=F.misses.map(([y,r,p])=>`${y} (${r}; previu ${p})`).join(', ');
  const W27=SEL.temporal&&SEL.temporal['2027']?SEL.temporal['2027'].weights:HW;
  const hw=M.PRED_FEATURES.map((f,i)=>[f[1],W27[i]]).filter(x=>Math.abs(x[1])>0.001).sort((a,b)=>b[1]-a[1]);
  $('#view').innerHTML=`<div class="panel"><div class="prose">
  <h2>Como funciona</h2>
  <p>O vídeo que serviu de base descreve dois modelos: um “histórico”, com regras ajustadas para os vencedores de 2010 a 2025, e um “justo”, sem troféus de equipa e corrigido por posição, força da liga e minutos. Os pesos não são divulgados, por isso recriei-os por aproximação. O que está aqui não é o modelo do vídeo, é uma reconstrução minha.</p>
  <h3 style="color:var(--hist)">Previsão</h3>
  <p>Pontuação linear sobre ${M.PRED_FEATURES.length} critérios (produção ofensiva, fase europeia, seleção, título, posição, contributo não ofensivo e versões relativas aos rivais do ano). Os pesos saem de um programa linear que tenta pôr cada vencedor à frente de todos os outros candidatos do seu ano. Para os anos já atribuídos, a resposta é a votação real; o que interessa é prever o ano seguinte. Por isso a Previsão é avaliada como seria usada: para prever o ano Y treina-se só com anos anteriores a Y.</p>
  ${SEL.temporal?`<p>Como se escolhe o treino: para cada ano, entre várias janelas (desde 1956, 1970, 1980, 1990, 2000 ou 2005, ou só os últimos 10–25 anos), pesos para os anos recentes e regularização, fica a combinação que melhor teria previsto os 12 anos anteriores. Com esta regra, em 2010–2026 acerta ${SEL.nestedWindow.hits} de ${SEL.targets.length} (vencedor real, em média, no ${SEL.nestedWindow.meanRank.toFixed(2).replace('.',',')}.º lugar), contra ${SEL.baseline.hits} de ${SEL.targets.length} treinando sempre com todos os anos desde 1956. Os votos antigos atrapalham a previsão dos recentes: a partir de 2013 a regra escolhe sempre “treino desde 2000”. Para a próxima Bola de Ouro o modelo é: ${esc(SEL.final.label)}, treino ${SEL.final.train[0]}–${SEL.final.train[1]} (pesos na tabela).</p>
  ${SEL.nested?`<p>Também tentei escolher só alguns critérios. Olhando para os mesmos anos parecia muito melhor (${SEL.selection.res[0]} de ${SEL.targets.length} com ${SEL.selection.chosen.length} critérios), mas fazendo essa escolha só com o passado de cada ano o resultado desce para ${SEL.nested.hits} de ${SEL.targets.length}, com o vencedor real, em média, no ${SEL.nested.meanRank.toFixed(2).replace('.',',')}.º lugar: era sobreajuste. Ficam os ${M.PRED_FEATURES.length} critérios.</p>`:''}`:''}
  ${SEL.videoStyle?(()=>{const V=SEL.videoStyle,b=V.find(v=>!v.extra),all=V.filter(v=>v.extra&&v.inSample===SEL.targets.length),n=SEL.targets.length;
    return `<p>O vídeo diz acertar todos os vencedores de 2010 a 2026, ajustando os pesos a esses mesmos anos. Fiz o mesmo: com os ${M.PRED_FEATURES.length} critérios, o ajuste a 2010–2026 acerta ${b.inSample} de ${n}; juntando um só critério de reputação ou de “figura do torneio”, chega a ${n} de ${n} (qualquer um destes: ${all.map(v=>esc(v.desc)).join('; ')}). Mas acertar anos que o modelo já viu é decorá-los. A prever cada ano sem o ver, nenhum destes critérios melhora a Previsão: com eles fica entre ${Math.min(...all.map(v=>v.temporal))} e ${Math.max(...all.map(v=>v.temporal))} de ${n}, contra ${b.temporal} de ${n} sem eles. Por isso a Previsão fica sem eles.</p>
    <div class="scroll"><table><tr><th>Critérios</th><th>Ajustado a 2010–2026 (dentro da amostra)</th><th>A prever sem ver o ano</th></tr>${V.map(v=>`<tr><td>${v.extra?'19 + '+esc(v.desc):'Só os 19 critérios'}</td><td class="n">${v.inSample}/${n}</td><td class="n">${v.temporal}/${n}</td></tr>`).join('')}</table></div>`})():''}
  <p>Na lista “Todos” há um ajuste único à parte, com os vencedores retroativos: ${FA.inSample}/${FA.n} dentro da amostra e ${FA.loo}/${FA.n} deixando um ano de fora. Tentei também ajustar os pesos à ordem do top 10 que o vídeo mostra para 2026, mas com os meus critérios isso fazia o modelo perder vencedores reais, por isso não a usei. Mostro essa lista como referência.</p>
  <div class="scroll"><table><tr><th>Critério</th><th>Peso</th></tr>${hw.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${x[1].toFixed(2)}</td></tr>`).join('')}</table></div>
  <h3 style="color:var(--fair)">Justo</h3>
  <p>Só desempenho individual. Golos e assistências ajustados à força da liga em cada década, com bónus pequeno para a Europa, comparados com o que se espera de um candidato de elite na posição e encolhidos para a média quando há poucos jogos. Para médios, defesas e guarda-redes entra uma estimativa subjetiva do contributo não ofensivo.</p>
  <h3 style="color:var(--mine)">O meu</h3>
  <p>Cerca de 80% de desempenho individual e 20% de crédito de equipa. O crédito de equipa só conta na proporção do que o próprio jogador produziu na Europa, na seleção e no campeonato, para que ganhar sem contribuir não dê pontos. Dou mais peso à produção contra adversários de topo (Europa e torneios de seleções). Podes alterar todos estes pesos na vista “Por ano”.</p>
  <h2>Limites dos dados</h2>
  <ul>
   <li>Âmbito igual para todos: liga, competições europeias e fase final de torneios de seleções. Taças nacionais e qualificação ficam de fora.</li>
   <li>Cada ano tem o top 10 da votação oficial e, quando faz sentido, alguns inelegíveis fortes (só aparecem na lista “Todos”). Elegibilidade: até 1994 só europeus; de 1995 a 2006 só jogadores em clubes europeus; desde 2007 todos.</li>
   <li>Janela: até 2021 os votantes julgavam o ano civil, por isso os números são de janeiro a dezembro. Quando não foi possível dividir a época, usa-se a época que termina nesse ano, marcada com confiança C. Desde 2022 conta a época.</li>
   <li>Confiança: A verificado em fontes, B parcialmente verificado, C estimativa. As assistências têm confiança própria: antes de cerca de 2005 são quase sempre estimadas.</li>
   <li>A força das ligas e o peso das taças europeias (Taça das Taças, Taça UEFA, Libertadores) mudam por década. São estimativas minhas, não ajustadas aos vencedores.</li>
   <li>O contributo não ofensivo é uma estimativa minha e pesa bastante nos médios e defesas.</li>
   <li>Os modelos medem desempenho, não a narrativa que influencia os votantes, e com uma amostra tão pequena qualquer ajuste aos vencedores pode estar sobreajustado (ver o Método).</li>
  </ul>
  <h2>Fontes</h2>
  <p>Resultados das votações: Wikipedia, RSSSF e FIFA/France Football. 2026: Yahoo Sports e Foot Africa. Estatísticas: as fontes consultadas para cada jogador aparecem no seu detalhe, na vista “Por ano” (ficheiro sources.json no repositório). Vídeo: “I know who wins the Ballon d’Or 2026” (Pogorabona).</p>
  </div></div>`;
}

function render(){tabs();if(st.tab==='ano')viewYear();else if(st.tab==='resumo')summary();else method();}
window.addEventListener('hashchange',()=>{try{const h=location.hash.slice(1);if(h==='resumo'||h==='metodo'){st.tab=h}else if(/^a\d{4}$/.test(h)&&YEARS[h.slice(1)]){st.tab='ano';st.year=+h.slice(1)}else return;render()}catch(e){}});
render();
})();
</script>
