# Refreshes the 2027 forecast every morning: pulls live numbers (football-data.org + Wikipedia), commits
# forecast/2027.json and forecast/history.json to main when they change, and redeploys the site.
# Needs the repository secret FOOTBALL_DATA_TOKEN (free account at football-data.org).
name: Forecast

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the token
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: test -n "$FOOTBALL_DATA_TOKEN" || { echo "::error::Add the FOOTBALL_DATA_TOKEN repository secret (Settings → Secrets and variables → Actions)"; exit 1; }
      - name: Update the forecast
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # optional: without it the Europa/Conference League assists stay unknown
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node forecast/update.js
      - name: Check the forecast
        run: node --test tests/unit/forecast.test.js
      - name: Commit when it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast/2027.json forecast/history.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Forecast update $(date -u +%F)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
