version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      playwright:
        patterns: ["@playwright/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # numpy 2.5+ and scipy 1.18+ need Python 3.12; CI (weights.yml) and the local setup use 3.11
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
      - dependency-name: scipy
        versions: [">=1.18"]
